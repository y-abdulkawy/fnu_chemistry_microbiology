<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الطالب - جامعة الفيوم الأهلية</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, sans-serif; padding-bottom: 40px; }
        .header-box { background: linear-gradient(135deg, #0d6efd, #0a58ca); color: white; border-radius: 16px; padding: 25px; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(13,110,253,0.2); }
        .main-card { border-radius: 16px; border: none; box-shadow: 0 6px 20px rgba(0,0,0,0.06); background: #ffffff; }
        .course-accordion-item { border: 1px solid #e9ecef; border-radius: 10px; margin-bottom: 10px; overflow: hidden; background: #fff; }
        .course-accordion-header { padding: 14px 18px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: bold; color: #0a58ca; background: #fff; }
        .course-accordion-body { padding: 14px 18px; background: #fafbfc; border-top: 1px solid #e9ecef; }
        .nav-tabs .nav-link { font-weight: bold; color: #555; border: none; border-bottom: 3px solid transparent; font-size: 1.1rem; }
        .nav-tabs .nav-link.active { color: #0d6efd; border-bottom: 3px solid #0d6efd; background: transparent; }
        .home-btn { position: fixed; top: 15px; right: 15px; z-index: 9999; background-color: #6c757d; color: white; padding: 8px 15px; border-radius: 8px; text-decoration: none; font-weight: bold; }
        .quiz-card { border-right: 5px solid #198754; }
    </style>
</head>
<body>

    <a href="index.html" class="home-btn">🏠 الرئيسية</a>

    <!-- 1. شاشة الدخول -->
    <div id="loginScreen" class="container mt-5" style="max-width: 500px;">
        <div class="main-card p-5 text-center">
            <h3 class="fw-bold text-primary mb-4">🔑 دخول الطالب</h3>
            <form onsubmit="handleLogin(event)">
                <div class="mb-4">
                    <label class="form-label fw-bold">الرقم القومي:</label>
                    <input type="text" id="loginNationalId" class="form-control form-control-lg" maxlength="14" required placeholder="14 رقم قومي">
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fs-5 fw-bold" id="loginBtn">دخول</button>
            </form>
            <div id="loginAlert" class="alert d-none mt-3"></div>
            
            <hr class="my-4">
            <p class="text-muted small mb-0">طالب جديد؟ تواصل مع شؤون الطلاب لتفعيل حسابك.</p>
        </div>
    </div>

    <!-- 2. شاشة إكمال البيانات (تظهر لو الحساب ناقص) -->
    <div id="registerScreen" class="container mt-4 d-none" style="max-width: 800px;">
        <div class="main-card p-4">
            <h4 class="fw-bold text-primary mb-3">إكمال بيانات الحساب</h4>
            <form onsubmit="handleStudentReg(event)">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">الاسم رباعياً:</label>
                        <input type="text" id="stuFullName" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">الرقم القومي:</label>
                        <input type="text" id="stuNationalId" class="form-control" readonly>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">رقم الهاتف:</label>
                        <input type="tel" id="stuPhone" class="form-control" maxlength="12" required placeholder="20xxxxxxxxxx">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">البريد الإلكتروني:</label>
                        <input type="email" id="stuEmail" class="form-control" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-bold">المقررات المسجلة:</label>
                        <div id="stuRegCoursesList" class="p-3 border rounded bg-light">جاري التحميل...</div>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 mt-4 py-2 fs-5 fw-bold" id="regBtn">حفظ البيانات</button>
            </form>
            <div id="regAlert" class="alert d-none mt-3"></div>
        </div>
    </div>

    <!-- 3. لوحة تحكم الطالب (الرئيسية) -->
    <div id="studentDashboard" class="container mt-4 d-none" style="max-width: 1100px;">
        
        <!-- الهيدر -->
        <div class="header-box d-flex justify-content-between align-items-center flex-wrap">
            <div>
                <h3 class="fw-bold mb-1" id="stuWelcome">أهلاً بك</h3>
                <span class="badge bg-light text-dark p-2 me-2" id="stuDetails">المستوى</span>
                <span class="badge bg-success p-2" id="stuHoursBadge">الساعات</span>
            </div>
            <div class="mt-2 mt-md-0 d-flex gap-2">
                <a href="student_gpatracker.html" class="btn btn-warning btn-sm fw-bold">📊 نظام GPA</a>
                <button class="btn btn-outline-danger btn-sm fw-bold" onclick="logout()">خروج</button>
            </div>
        </div>

        <!-- التابات -->
        <ul class="nav nav-tabs mb-4" id="studentTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="courses-tab" data-bs-toggle="tab" data-bs-target="#courses-pane" type="button" role="tab" onclick="loadStudentCourses()">📚 المقررات والملفات</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="quizzes-tab" data-bs-toggle="tab" data-bs-target="#quizzes-pane" type="button" role="tab" onclick="loadStudentQuizzes()">📝 الكويزات</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="profile-tab" data-bs-toggle="tab" data-bs-target="#profile-pane" type="button" role="tab" onclick="loadProfile()">👤 بياناتي</button>
            </li>
        </ul>

        <!-- محتوى التابات -->
        <div class="tab-content" id="studentTabsContent">
            
            <!-- 1. تاب المقررات والملفات -->
            <div class="tab-pane fade show active" id="courses-pane" role="tabpanel">
                <div id="studentCoursesList">
                    <div class="text-center text-muted p-4">جاري تحميل المقررات...</div>
                </div>
            </div>

            <!-- 2. تاب الكويزات -->
            <div class="tab-pane fade" id="quizzes-pane" role="tabpanel">
                <div id="studentQuizzesList">
                    <div class="text-center text-muted p-4">جاري تحميل الكويزات...</div>
                </div>
            </div>

            <!-- 3. تاب بياناتي -->
            <div class="tab-pane fade" id="profile-pane" role="tabpanel">
                <div class="main-card p-4">
                    <h5 class="fw-bold text-primary mb-4">⚙️ بياناتي الشخصية</h5>
                    <form onsubmit="saveProfile(event)">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">الاسم:</label>
                                <input type="text" id="profName" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">الرقم القومي:</label>
                                <input type="text" id="profNationalId" class="form-control" readonly>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">رقم الهاتف:</label>
                                <input type="tel" id="profPhone" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">البريد الإلكتروني:</label>
                                <input type="email" id="profEmail" class="form-control" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary mt-4 fw-bold" id="profBtn">إرسال طلب التعديل</button>
                    </form>
                    <div id="profAlert" class="alert d-none mt-3"></div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = 'https://fnuebook.yma00.workers.dev'; 
        let currentUser = null;

        async function apiCall(action, params) {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({ action: action, ...(params || {}) })
                });
                if (!response.ok) return { success: false, message: 'خطأ من السيرفر: ' + response.status };
                return await response.json();
            } catch (err) {
                return { success: false, message: 'خطأ في الاتصال: ' + err.message };
            }
        }

        // 1. تسجيل الدخول
        function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const alertDiv = document.getElementById('loginAlert');
            const nationalId = document.getElementById('loginNationalId').value.trim();
            
            btn.disabled = true; btn.innerText = 'جاري التحقق...'; alertDiv.className = 'd-none';

            apiCall('loginStudent', { nationalId: nationalId }).then(res => {
                btn.disabled = false; btn.innerText = 'دخول';
                if (res.success) {
                    currentUser = res.user;
                    document.getElementById('loginScreen').classList.add('d-none');
                    document.getElementById('studentDashboard').classList.remove('d-none');
                    document.getElementById('stuWelcome').innerText = `أهلاً بك، ${res.user.fullName}`;
                    document.getElementById('stuDetails').innerText = res.user.level;
                    document.getElementById('stuHoursBadge').innerText = `الساعات: ${res.user.totalHours || 0}`;
                    loadStudentCourses();
                } else if (res.needsCompletion) {
                    alertDiv.className = 'alert alert-warning mt-3 d-block';
                    alertDiv.innerText = 'حسابك غير مكتمل، جاري تحويلك...';
                    setTimeout(() => {
                        apiCall('checkStudentPreRegistered', { nationalId: nationalId }).then(pRes => {
                            if (pRes.success) {
                                document.getElementById('loginScreen').classList.add('d-none');
                                document.getElementById('registerScreen').classList.remove('d-none');
                                document.getElementById('stuNationalId').value = pRes.student.nationalId;
                                document.getElementById('stuFullName').value = pRes.student.fullName || '';
                                // (هنا ممكن نملأ باقي الحقول لو حابب)
                            }
                        });
                    }, 1500);
                } else {
                    alertDiv.className = 'alert alert-danger mt-3 d-block';
                    alertDiv.innerText = res.message;
                }
            });
        }

        function logout() {
            location.reload(); // أبسط طريقة لإعادة تصفير الصفحة
        }

        // 2. تحميل المقررات
        function loadStudentCourses() {
            const container = document.getElementById('studentCoursesList');
            container.innerHTML = '<div class="text-center text-muted p-4">جاري التحميل...</div>';
            
            apiCall('fetchCoursesForStudent', { nationalId: currentUser.nationalId }).then(res => {
                if (!res.success) { container.innerHTML = `<div class="alert alert-danger">${res.message}</div>`; return; }
                if (res.courses.length === 0) { container.innerHTML = '<div class="alert alert-warning text-center">لم يتم رفع ملفات لمقرراتك بعد.</div>'; return; }

                let html = '';
                res.courses.forEach((c, idx) => {
                    const filesList = JSON.parse(c.files || "[]");
                    const filesHtml = filesList.length > 0 
                        ? filesList.map(f => `<a href="${f.url}" target="_blank" class="btn btn-sm btn-outline-primary m-1">📄 ${f.title}</a>`).join('')
                        : '<span class="text-muted small">لا يوجد ملفات</span>';

                    html += `
                        <div class="main-card p-3 mb-3">
                            <div class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-2">
                                <h5 class="fw-bold text-primary mb-0">📖 ${c.courseName}</h5>
                                <span class="badge bg-info text-dark">د. ${c.doctorName || 'غير محدد'}</span>
                            </div>
                            <div class="mt-2">${filesHtml}</div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            });
        }

        // 3. تحميل الكويزات
        function loadStudentQuizzes() {
            const container = document.getElementById('studentQuizzesList');
            container.innerHTML = '<div class="text-center text-muted p-4">جاري التحميل...</div>';
            
            apiCall('fetchQuizzesForStudent', { nationalId: currentUser.nationalId }).then(res => {
                if (!res.success) { container.innerHTML = `<div class="alert alert-danger">${res.message}</div>`; return; }
                if (res.quizzes.length === 0) { container.innerHTML = '<div class="alert alert-info text-center">لا توجد كويزات متاحة حالياً.</div>'; return; }

                container.innerHTML = res.quizzes.map((quiz, qIndex) => `
                    <div class="main-card p-4 mb-4 quiz-card">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="fw-bold text-success mb-0">${quiz.quizTitle}</h5>
                            <span class="badge bg-secondary">${quiz.courseName} - د. ${quiz.doctorName}</span>
                        </div>
                        <form id="quizForm_${qIndex}" onsubmit="submitQuizAnswers(event, ${qIndex}, ${JSON.stringify(quiz.questions).replace(/"/g, '&quot;')})">
                            ${quiz.questions.map((q, idx) => `
                                <div class="mb-4 bg-light p-3 rounded">
                                    <p class="fw-bold fs-6">${idx + 1}. ${q.question} <span class="badge bg-dark">${q.grade} درجة</span></p>
                                    ${q.options.map((opt, oIdx) => `
                                        <div class="form-check mb-1">
                                            <input class="form-check-input" type="radio" name="q_${qIndex}_${idx}" value="${oIdx + 1}" id="q_${qIndex}_${idx}_${oIdx}" required>
                                            <label class="form-check-label" for="q_${qIndex}_${idx}_${oIdx}">${opt}</label>
                                        </div>
                                    `).join('')}
                                </div>
                            `).join('')}
                            <button type="submit" class="btn btn-success w-100 fw-bold py-2">تسليم الكويز</button>
                        </form>
                    </div>
                `).join('');
            });
        }

        // 4. تصحيح الكويز
        function submitQuizAnswers(event, quizIndex, questions) {
            event.preventDefault();
            let correctCount = 0, totalGrades = 0, earnedGrades = 0;

            questions.forEach((q, idx) => {
                const selected = document.querySelector(`input[name="q_${quizIndex}_${idx}"]:checked`);
                totalGrades += q.grade;
                if (selected && parseInt(selected.value) === q.correctAnswer) {
                    correctCount++;
                    earnedGrades += q.grade;
                }
            });

            const percentage = totalGrades > 0 ? (earnedGrades / totalGrades) * 100 : 0;
            alert(`✅ تم التسليم!\n\nالنتيجة: ${earnedGrades} / ${totalGrades} (${percentage.toFixed(1)}%)\nإجابات صحيحة: ${correctCount} من ${questions.length}`);
            
            // قفل الفورم بعد التسليم عشان ميعيدش
            event.target.querySelector('button[type="submit"]').disabled = true;
            event.target.querySelector('button[type="submit"]').innerText = 'تم التسليم ✅';
        }

        // 5. تحميل وحفظ البيانات الشخصية
        function loadProfile() {
            // بما إننا معانا بيانات اليوزر من الدخول، نعرضها هنا
            document.getElementById('profName').value = currentUser.fullName || '';
            document.getElementById('profNationalId').value = currentUser.nationalId || '';
            // محتاجين نجيب باقي البيانات من السيرفر
            apiCall('getStudentProfile', { nationalId: currentUser.nationalId }).then(res => {
                if (res.success) {
                    document.getElementById('profPhone').value = res.profile.phone || '';
                    document.getElementById('profEmail').value = res.profile.email || '';
                }
            });
        }

        function saveProfile(e) {
            e.preventDefault();
            const btn = document.getElementById('profBtn');
            const alertDiv = document.getElementById('profAlert');
            
            // هنا بنبعت طلب تعديل (زي ما عملنا في الكود القديم)
            const changes = {
                "رقم الهاتف": { old: "", new: document.getElementById('profPhone').value.trim() },
                "البريد الإلكتروني": { old: "", new: document.getElementById('profEmail').value.trim() }
            };

            btn.disabled = true; btn.innerText = 'جاري الإرسال...';
            
            apiCall('submitEditRequest', {
                userNationalId: currentUser.nationalId, userType: "student", userName: currentUser.fullName, changes: changes
            }).then(res => {
                btn.disabled = false; btn.innerText = 'إرسال طلب التعديل';
                alertDiv.className = res.success ? 'alert alert-success mt-3' : 'alert alert-danger mt-3';
                alertDiv.innerText = res.message;
            });
        }

        // دالة إكمال التسجيل (للطلاب الجدد)
        function handleStudentReg(e) {
            e.preventDefault();
            // ... (نفس كود التسجيل اللي كان في الملف القديم)
            alert("سيتم تفعيل هذه الخطوة قريباً، تواصل مع الأدمن.");
        }
    </script>
</body>
</html>
