<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <title>إدارة الجدول الدراسي</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <style>
        .timetable-wrapper { overflow-x: auto; background: white; padding: 10px; border-radius: 10px; width: 100%; border: 1px solid #dee2e6; }
        .timetable-main { border-collapse: collapse; width: 100%; min-width: 1500px; text-align: center; font-size: 11px; }
        .timetable-main th, .timetable-main td { border: 1px solid #adb5bd; padding: 3px; }
        .timetable-main th { background-color: #0d6efd; color: white; font-size: 12px; }
        .day-header { background-color: #0a58ca !important; color: white; font-weight: bold; }
        .place-cell { background-color: #f8f9fa; font-weight: bold; width: 90px; color: #0d6efd; }
        .capacity-cell { background-color: #e9ecef; font-weight: bold; width: 50px; }
        
        .cell-inputs input { 
            width: 100%; 
            border: 1px solid #ced4da; 
            border-radius: 4px; 
            font-size: 10px; 
            padding: 2px; 
            margin-bottom: 2px; 
            text-align: center; 
            background-color: #fff;
        }
        .cell-inputs input:focus { outline: none; border-color: #0d6efd; box-shadow: 0 0 0 0.1rem rgba(13,110,253,.25); }
        
        .booked-cell { background-color: #f8d7da !important; }
        .booked-cell input { background-color: #f8d7da; color: #842029; font-weight: bold; border-color: #f5c2c7; font-size: 10px; }        
        .login-card { max-width: 400px; margin: 100px auto; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); background: #fff; }
    </style>
</head>
<body class="bg-light">

<!-- شاشة الدخول -->
<div id="loginScreen" class="login-card">
    <h3 class="text-center text-primary mb-4">🔐 دخول مديري البرامج</h3>
    <form onsubmit="handleAdminLogin(event)">
        <div class="mb-3"><label class="fw-bold">اسم المستخدم:</label><input type="text" id="adminUsername" class="form-control" required></div>
        <div class="mb-3"><label class="fw-bold">كلمة المرور:</label><input type="password" id="adminPassword" class="form-control" required></div>
        <button type="submit" class="btn btn-primary w-100 fw-bold" id="loginBtn">دخول</button>
    </form>
    <div id="loginAlert" class="alert d-none mt-3"></div>
</div>

<!-- شاشة الجدول -->
<div id="timetableScreen" class="container-fluid mt-3 d-none">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="text-primary m-0">📅 إدارة الجدول الدراسي</h3>
        <div>
            <span class="badge bg-info text-dark fs-6 me-2" id="welcomeUser"></span>
            <button class="btn btn-outline-danger btn-sm fw-bold" onclick="logoutAdmin()">خروج</button>
        </div>
    </div>
     <div class="alert alert-info py-2 small mb-3">
        💡 <strong>ملاحظة:</strong> الخلايا باللون <span class="text-danger fw-bold">الأحمر</span> محجوزة بواسطة برامج أخرى، ولا يمكن تعديلها. يمكنك الكتابة في الخلايا البيضاء فقط.
    </div>

    
    <div class="row mb-3 bg-white p-3 rounded shadow-sm">
        <div class="col-md-6" id="singleProgramView" style="display: none;">
            <label class="fw-bold">البرنامج الدراسي:</label>
            <input type="text" id="programDisplay" class="form-control" readonly style="background-color: #e9ecef; font-weight: bold; color: #0d6efd;">
        </div>
        <div class="col-md-6" id="allProgramsView" style="display: none;">
            <label class="fw-bold">اختر البرنامج:</label>
            <select id="programSelect" class="form-select" onchange="loadSchedule()"></select>
        </div>
        <div class="col-md-6">
            <label class="fw-bold">الفرقة:</label>
            <select id="levelSelect" class="form-select" onchange="loadSchedule()">
                <option value="">اختر الفرقة...</option>
                <option value="1">الفرقة الأولى</option>
                <option value="2">الفرقة الثانية</option>
            </select>
        </div>
    </div>

    <div class="timetable-wrapper shadow-sm">
        <table class="timetable-main" id="mainTable"></table>
    </div>

    <button class="btn btn-success w-100 mt-3 fw-bold py-2" onclick="saveSchedule()" id="saveBtn">💾 حفظ الجدول</button>
</div>

<script>
    const API_URL = 'https://fnuebook.yma00.workers.dev'; 
    const HALLS = ["GB-Eduo01","1B-Edu02","1B-Edu03","2B-EDU01","2B-EDU02","2B-EDU03","2B-EDU04","2B-EDU05","2B-EDU06","3B-EDU01","3B-LAB02","3B-LAB03","3B-LAB04","3B-LAB05","3B-LAB06","3B-LAB07","3B-LAB08","4B-EDU01","4B-EDU02","4B-EDU03","4B-EDU04","4B-EDU05","4B-EDU06","4B-EDU07","4B-EDU08","4B-EDU09"];
    
    const HALL_CAPACITIES = {
        "GB-Eduo01": 90, "1B-Edu02": 70, "1B-Edu03": 70, "2B-EDU01": 150, "2B-EDU02": 70, "2B-EDU03": 70, "2B-EDU04": 70, "2B-EDU05": 70, "2B-EDU06": 30, "3B-EDU01": 100, "3B-LAB02": 70, "3B-LAB03": 70, "3B-LAB04": 70, "3B-LAB05": 70, "3B-LAB06": 70, "3B-LAB07": 70, "3B-LAB08": 30, "4B-EDU01": 100, "4B-EDU02": 100, "4B-EDU03": 70, "4B-EDU04": 70, "4B-EDU05": 70, "4B-EDU06": 70, "4B-EDU07": 70, "4B-EDU08": 70, "4B-EDU09": 30
    };

    const DAYS = ["السبت", "الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس"];
    const LECTURES = ["المحاضرة الأولى", "المحاضرة الثانية", "المحاضرة الثالثة", "المحاضرة الرابعة", "المحاضرة الخامسة"];

    let allBookedSlots = [];
    let currentAdminProgram = ""; 
    let isSuperAdmin = false;

    async function apiCall(action, params) {
        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify({ action: action, ...(params || {}) })
            });
            return await response.json();
        } catch (err) { return { success: false, message: err.message }; }
    }

    async function handleAdminLogin(e) {
        e.preventDefault();
        const u = document.getElementById('adminUsername').value.trim();
        const p = document.getElementById('adminPassword').value.trim();
        const btn = document.getElementById('loginBtn');
        const alertDiv = document.getElementById('loginAlert');

        btn.disabled = true; btn.innerText = 'جاري التحقق...'; alertDiv.className = 'd-none';

        const res = await apiCall('loginTimetableAdmin', { username: u, password: p });
        btn.disabled = false; btn.innerText = 'دخول';
        
        if (res.success) {
            localStorage.setItem('fnu_tt_user', u);
            localStorage.setItem('fnu_tt_isSuper', res.isSuperAdmin);
            localStorage.setItem('fnu_tt_program', res.isSuperAdmin ? "" : res.programCode);
            localStorage.setItem('fnu_tt_programName', res.isSuperAdmin ? "" : res.programName);

            document.getElementById('loginScreen').classList.add('d-none');
            document.getElementById('timetableScreen').classList.remove('d-none');
            document.getElementById('welcomeUser').innerText = "مرحباً، " + u;

            if (res.isSuperAdmin) {
                isSuperAdmin = true;
                document.getElementById('allProgramsView').style.display = 'block';
                document.getElementById('singleProgramView').style.display = 'none';
                setupProgramsDropdownForAdmin();
            } else {
                isSuperAdmin = false;
                currentAdminProgram = res.programCode;
                document.getElementById('allProgramsView').style.display = 'none';
                document.getElementById('singleProgramView').style.display = 'block';
                document.getElementById('programDisplay').value = res.programName;
                buildTable();
                loadSchedule();
            }
        } else {
            alertDiv.className = 'alert alert-danger mt-3 d-block';
            alertDiv.innerText = res.message;
        }
    }

    async function setupProgramsDropdownForAdmin() {
        const sel = document.getElementById('programSelect');
        sel.innerHTML = '<option value="">اختر البرنامج...</option>';
        const res = await apiCall('getProgramsList');
        if (res.success && res.programs) {
            res.programs.forEach(p => { sel.innerHTML += `<option value="${p.id}">${p.name}</option>`; });
        }
        buildTable();
    }

    function buildTable() {
        const table = document.getElementById('mainTable');
        let html = '';

        html += `<tr><th rowspan="2" style="vertical-align: middle;">المكان</th><th rowspan="2" style="vertical-align: middle;">السعة</th>`;
        DAYS.forEach(day => {
            html += `<th colspan="5" class="day-header">${day}</th>`;
        });
        html += `</tr>`;

        html += `<tr>`;
        DAYS.forEach(() => {
            LECTURES.forEach(lect => {
                html += `<th style="font-size:11px; background-color:#6c757d; color:white;">${lect}</th>`;
            });
        });
        html += `</tr>`;

        HALLS.forEach((hall, hallIndex) => {
            html += `<tr>`;
            html += `<td class="place-cell">${hall}</td>`;
            html += `<td class="capacity-cell">${HALL_CAPACITIES[hall] || '-'}</td>`;

            DAYS.forEach((day, dayIndex) => {
                LECTURES.forEach((lect, lectIndex) => {
                    const cellId = `cell_${hallIndex}_${dayIndex}_${lectIndex}`;
                    html += `
                        <td style="padding: 2px;">
                            <div class="cell-inputs" id="container_${cellId}">
                                <input type="text" placeholder="المقرر" id="${cellId}_course">
                                <input type="text" placeholder="الدكتور" id="${cellId}_doctor">
                                <input type="text" placeholder="الفرقة" id="${cellId}_level">
                            </div>
                        </td>
                    `;
                });
            });
            html += `</tr>`;
        });

        table.innerHTML = html;
    }

    async function loadSchedule() {
        let program = isSuperAdmin ? document.getElementById('programSelect').value : currentAdminProgram;
        const level = document.getElementById('levelSelect').value;

        // لو مفيش برنامج أو فرقة، نفتح كل الخلايا ونفضيها
        if (!program || !level) {
            document.querySelectorAll('.cell-inputs input').forEach(input => {
                input.value = '';
                input.disabled = false;
            });
            document.querySelectorAll('.cell-inputs').forEach(div => div.parentElement.classList.remove('booked-cell'));
            return;
        }

        const res = await apiCall('getBookedSlots');
        if (res.success) {
            allBookedSlots = res.booked;
            fillTableWithData(program, level);
        } else {
            alert("خطأ في جلب البيانات: " + res.message);
        }
    }

    function fillTableWithData(currentProgram, currentLevel) {
        // نفتح كل الخلايا الأول
        document.querySelectorAll('.cell-inputs input').forEach(input => {
            input.value = '';
            input.disabled = false;
        });
        document.querySelectorAll('.cell-inputs').forEach(div => div.parentElement.classList.remove('booked-cell'));

        allBookedSlots.forEach(booking => {
            const hallIndex = HALLS.indexOf(booking.hall);
            const dayIndex = DAYS.indexOf(booking.day);
            const lectIndex = LECTURES.indexOf(booking.lecture);

            if (hallIndex !== -1 && dayIndex !== -1 && lectIndex !== -1) {
                const cellId = `cell_${hallIndex}_${dayIndex}_${lectIndex}`;
                const container = document.getElementById(`container_${cellId}`);
                
                if (container) {
                    const isMine = (booking.program === currentProgram && booking.level === currentLevel);
                    
                    if (isMine) {
                        document.getElementById(`${cellId}_course`).value = booking.courseName || "";
                        document.getElementById(`${cellId}_doctor`).value = booking.doctorName || "";
                        document.getElementById(`${cellId}_level`).value = booking.studentLevel || "";
                    } else {
                        // لو محجوز من دكتور تاني
                        container.parentElement.classList.add('booked-cell');
                        
                        // نعرض اسم المقرر والدكتور اللي حاجزين
                        document.getElementById(`${cellId}_course`).value = booking.courseName || "محجوز";
                        document.getElementById(`${cellId}_doctor`).value = "د. " + (booking.doctorName || "غير محدد");
                        document.getElementById(`${cellId}_level`).value = booking.studentLevel || "";
                        
                        // نقفل الخلايا عشان ميعرفش يعدلها
                        document.getElementById(`${cellId}_course`).disabled = true;
                        document.getElementById(`${cellId}_doctor`).disabled = true;
                        document.getElementById(`${cellId}_level`).disabled = true;
                    }
                }
            }
        });
    }

    async function saveSchedule() {
        let program = isSuperAdmin ? document.getElementById('programSelect').value : currentAdminProgram;
        const level = document.getElementById('levelSelect').value;

        if (!program || !level) return alert("اختر البرنامج والفرقة أولاً");

        const schedule = [];
        HALLS.forEach((hall, hallIndex) => {
            DAYS.forEach((day, dayIndex) => {
                LECTURES.forEach((lect, lectIndex) => {
                    const cellId = `cell_${hallIndex}_${dayIndex}_${lectIndex}`;
                    const course = document.getElementById(`${cellId}_course`).value.trim();
                    const doctor = document.getElementById(`${cellId}_doctor`).value.trim();
                    const stuLevel = document.getElementById(`${cellId}_level`).value.trim();

                    if (course || doctor || stuLevel) {
                        schedule.push({ 
                            day: day, lecture: lect, hall: hall, 
                            courseName: course, doctorName: doctor, studentLevel: stuLevel, 
                            capacity: HALL_CAPACITIES[hall] 
                        });
                    }
                });
            });
        });

        if (schedule.length === 0) return alert("لم تقم بإدخال أي بيانات في الجدول.");

        const btn = document.getElementById('saveBtn');
        btn.disabled = true; btn.innerText = 'جاري الحفظ...';

        const res = await apiCall('saveProgramSchedule', {
            payload: { program: program, level: level, schedule: schedule }
        });

        btn.disabled = false; btn.innerText = '💾 حفظ الجدول';
        alert(res.message);
        if (res.success) loadSchedule();
    }

    function logoutAdmin() {
        localStorage.removeItem('fnu_tt_user');
        localStorage.removeItem('fnu_tt_isSuper');
        localStorage.removeItem('fnu_tt_program');
        localStorage.removeItem('fnu_tt_programName');
        location.reload();
    }

    document.addEventListener('DOMContentLoaded', () => {
        const savedUser = localStorage.getItem('fnu_tt_user');
        const savedIsSuper = localStorage.getItem('fnu_tt_isSuper');
        const savedProgram = localStorage.getItem('fnu_tt_program');
        const savedProgramName = localStorage.getItem('fnu_tt_programName');

        if (savedUser) {
            document.getElementById('loginScreen').classList.add('d-none');
            document.getElementById('timetableScreen').classList.remove('d-none');
            document.getElementById('welcomeUser').innerText = "مرحباً، " + savedUser;

            if (savedIsSuper === 'true') {
                isSuperAdmin = true;
                document.getElementById('allProgramsView').style.display = 'block';
                document.getElementById('singleProgramView').style.display = 'none';
                setupProgramsDropdownForAdmin();
            } else {
                isSuperAdmin = false;
                currentAdminProgram = savedProgram;
                document.getElementById('allProgramsView').style.display = 'none';
                document.getElementById('singleProgramView').style.display = 'block';
                document.getElementById('programDisplay').value = savedProgramName; 
                buildTable();
                loadSchedule();
            }
        }
    });
</script>
</body>
</html>
