<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <title>إدارة الجدول الدراسي</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <style>
        .timetable-table th, .timetable-table td { text-align: center; vertical-align: middle; }
        .timetable-table select { width: 100%; padding: 5px; border-radius: 5px; font-size: 0.85rem; }
        .booked { background-color: #f8d7da !important; color: #842029; font-weight: bold; pointer-events: none; opacity: 0.7; }
    </style>
</head>
<body class="bg-light">

<div class="container mt-4">
    <h3 class="text-center text-primary mb-4">📅 إدارة الجدول الدراسي</h3>

    <div class="row mb-4 bg-white p-3 rounded shadow-sm">
        <div class="col-md-5">
            <label class="fw-bold">البرنامج الدراسي:</label>
            <select id="programSelect" class="form-select" onchange="loadSchedule()">
                <option value="">اختر البرنامج...</option>
                <option value="P1">برنامج 1</option>
                <option value="P2">برنامج 2</option>
                <option value="P3">برنامج 3</option>
                <option value="P4">برنامج 4</option>
                <option value="P5">برنامج 5</option>
                <option value="P6">برنامج 6</option>
                <option value="P7">برنامج 7</option>
            </select>
        </div>
        <div class="col-md-5">
            <label class="fw-bold">الفرقة:</label>
            <select id="levelSelect" class="form-select" onchange="loadSchedule()">
                <option value="">اختر الفرقة...</option>
                <option value="1">الفرقة الأولى</option>
                <option value="2">الفرقة الثانية</option>
            </select>
        </div>
        <div class="col-md-2 d-flex align-items-end">
            <button class="btn btn-outline-secondary w-100" onclick="loadSchedule()">تحديث 🔄</button>
        </div>
    </div>

    <div class="table-responsive bg-white p-3 rounded shadow-sm">
        <table class="table table-bordered timetable-table">
            <thead class="table-dark">
                <tr>
                    <th>المحاضرة / اليوم</th>
                    <th>السبت</th><th>الأحد</th><th>الاثنين</th><th>الثلاثاء</th><th>الأربعاء</th><th>الخميس</th>
                </tr>
            </thead>
            <tbody id="timetableBody"></tbody>
        </table>
    </div>

    <button class="btn btn-success w-100 mt-3 fw-bold py-2" onclick="saveSchedule()" id="saveBtn">💾 حفظ الجدول</button>
</div>

<script>
    const API_URL = 'https://fnuebook.yma00.workers.dev'; 
    const HALLS = ["GB-Eduo01","1B-Edu02","1B-Edu03","2B-EDU01","2B-EDU02","2B-EDU03","2B-EDU04","2B-EDU05","2B-EDU06","3B-EDU01","3B-LAB02","3B-LAB03","3B-LAB04","3B-LAB05","3B-LAB06","3B-LAB07","3B-LAB08","4B-EDU01","4B-EDU02","4B-EDU03","4B-EDU04","4B-EDU05","4B-EDU06","4B-EDU07","4B-EDU08","4B-EDU09"];
    const DAYS = ["السبت", "الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس"];
    const LECTURES = ["المحاضرة الأولى", "المحاضرة الثانية", "المحاضرة الثالثة", "المحاضرة الرابعة", "المحاضرة الخامسة"];

    let allBookedSlots = [];

    async function apiCall(action, params) {
        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify({ action: action, ...(params || {}) })
            });
            return await response.json();
        } catch (err) { return { success: false, message: err.message }; }
    }

    async function loadSchedule() {
        const program = document.getElementById('programSelect').value;
        const level = document.getElementById('levelSelect').value;

        if (!program || !level) return renderTable([], '', '');

        const res = await apiCall('getBookedSlots');
        if (res.success) {
            allBookedSlots = res.booked;
            renderTable(allBookedSlots, program, level);
        } else {
            alert("خطأ في جلب البيانات: " + res.message);
        }
    }

    function renderTable(bookedData, currentProgram = '', currentLevel = '') {
        const tbody = document.getElementById('timetableBody');
        tbody.innerHTML = '';

        LECTURES.forEach(lecture => {
            let row = `<tr><td class="fw-bold bg-light">${lecture}</td>`;
            
            DAYS.forEach(day => {
                let options = `<option value="">-- اختر قاعة --</option>`;
                
                HALLS.forEach(hall => {
                    let isBookedByOther = bookedData.some(b => b.day === day && b.lecture === lecture && b.hall === hall && !(b.program === currentProgram && b.level === currentLevel));
                    let isBookedByMe = bookedData.some(b => b.day === day && b.lecture === lecture && b.hall === hall && b.program === currentProgram && b.level === currentLevel);

                    let disabled = isBookedByOther ? 'disabled' : '';
                    let selected = isBookedByMe ? 'selected' : '';
                    
                    options += `<option value="${hall}" ${disabled} ${selected}>${hall} ${isBookedByOther ? '(محجوزة)' : ''}</option>`;
                });
                
                row += `<td><select class="form-select" id="cell_${day}_${lecture}" ${bookedData.length > 0 && !currentProgram ? 'disabled' : ''}>${options}</select></td>`;
            });
            row += `</tr>`;
            tbody.innerHTML += row;
        });
    }

    async function saveSchedule() {
        const program = document.getElementById('programSelect').value;
        const level = document.getElementById('levelSelect').value;

        if (!program || !level) return alert("اختر البرنامج والفرقة أولاً");

        const schedule = [];
        DAYS.forEach(day => {
            LECTURES.forEach(lecture => {
                const sel = document.getElementById(`cell_${day}_${lecture}`);
                if (sel && sel.value) {
                    schedule.push({ day: day, lecture: lecture, hall: sel.value });
                }
            });
        });

        if (schedule.length === 0) return alert("لم تقم باختيار أي قاعة.");

        const btn = document.getElementById('saveBtn');
        btn.disabled = true; btn.innerText = 'جاري الحفظ...';

        const res = await apiCall('saveProgramSchedule', {
            payload: { program: program, level: level, schedule: schedule }
        });

        btn.disabled = false; btn.innerText = '💾 حفظ الجدول';
        
        alert(res.message);
        if (res.success) loadSchedule();
    }

    window.onload = () => renderTable([]);
</script>
</body>
</html>
