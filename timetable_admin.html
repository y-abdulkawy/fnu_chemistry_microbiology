<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <title>إدارة الجدول الدراسي</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <style>
        .timetable-table th, .timetable-table td { text-align: center; vertical-align: middle; }
        .timetable-table select { width: 100%; padding: 5px; border-radius: 5px; font-size: 0.85rem; }
        .login-card { max-width: 400px; margin: 100px auto; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); background: #fff; }
    </style>
</head>
<body class="bg-light">

<!-- شاشة الدخول -->
<div id="loginScreen" class="login-card">
    <h3 class="text-center text-primary mb-4">🔐 دخول مديري البرامج</h3>
    <form onsubmit="handleAdminLogin(event)">
        <div class="mb-3">
            <label class="fw-bold">اسم المستخدم:</label>
            <input type="text" id="adminUsername" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="fw-bold">كلمة المرور:</label>
            <input type="password" id="adminPassword" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 fw-bold" id="loginBtn">دخول</button>
    </form>
    <div id="loginAlert" class="alert d-none mt-3"></div>
</div>

<!-- شاشة الجدول (مخفية في البداية) -->
<div id="timetableScreen" class="container mt-4 d-none">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="text-primary m-0">📅 إدارة الجدول الدراسي</h3>
        <div>
            <span class="badge bg-info text-dark fs-6 me-2" id="welcomeUser"></span>
            <button class="btn btn-outline-danger btn-sm fw-bold" onclick="logoutAdmin()">خروج</button>
        </div>
    </div>

    <div class="row mb-4 bg-white p-3 rounded shadow-sm">
        <div class="col-md-6">
            <label class="fw-bold">البرنامج الدراسي:</label>
            <select id="programSelect" class="form-select" onchange="loadSchedule()" disabled>
                <!-- البرامج بتتحط هنا من الدالة -->
            </select>
        </div>
        <div class="col-md-6">
            <label class="fw-bold">الفرقة:</label>
            <select id="levelSelect" class="form-select" onchange="loadSchedule()">
                <option value="">اختر الفرقة...</option>
                <option value="1">الفرقة الأولى</option>
                <option value="2">الفرقة الثانية</option>
            </select>
        </div>
    </div>

    <div class="table-responsive bg-white p-3 rounded shadow-sm">
        <table class="table table-bordered timetable-table">
            <thead class="table-dark">
                <tr>
                    <th>المحاضرة / اليوم</th>
                    <th>السبت</th><th>الأحد</th><th>الاثنين</th><th>الثلاثاء</th><th>الأربعاء</th><th>الخميس</th>
                </tr>
            </thead>
            <tbody id="timetableBody"></tbody>
        </table>
    </div>

    <button class="btn btn-success w-100 mt-3 fw-bold py-2" onclick="saveSchedule()" id="saveBtn">💾 حفظ الجدول</button>
</div>

<script>
    const API_URL = 'https://fnuebook.yma00.workers.dev'; 
    const HALLS = ["GB-Eduo01","1B-Edu02","1B-Edu03","2B-EDU01","2B-EDU02","2B-EDU03","2B-EDU04","2B-EDU05","2B-EDU06","3B-EDU01","3B-LAB02","3B-LAB03","3B-LAB04","3B-LAB05","3B-LAB06","3B-LAB07","3B-LAB08","4B-EDU01","4B-EDU02","4B-EDU03","4B-EDU04","4B-EDU05","4B-EDU06","4B-EDU07","4B-EDU08","4B-EDU09"];
    const DAYS = ["السبت", "الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس"];
    const LECTURES = ["المحاضرة الأولى", "المحاضرة الثانية", "المحاضرة الثالثة", "المحاضرة الرابعة", "المحاضرة الخامسة"];
    
    // البرامج السبعة (تقدر تغير أسماؤها هنا)
    const PROGRAMS = {
        "P1": "برنامج 1",
        "P2": "برنامج 2",
        "P3": "برنامج 3",
        "P4": "برنامج 4",
        "P5": "برنامج 5",
        "P6": "برنامج 6",
        "P7": "برنامج 7"
    };

    let allBookedSlots = [];
    let currentAdminProgram = ""; // البرنامج اللي المدير بيديره

    async function apiCall(action, params) {
        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify({ action: action, ...(params || {}) })
            });
            return await response.json();
        } catch (err) { return { success: false, message: err.message }; }
    }

    // دالة تسجيل الدخول
    async function handleAdminLogin(e) {
        e.preventDefault();
        const u = document.getElementById('adminUsername').value.trim();
        const p = document.getElementById('adminPassword').value.trim();
        const btn = document.getElementById('loginBtn');
        const alertDiv = document.getElementById('loginAlert');

        btn.disabled = true; btn.innerText = 'جاري التحقق...'; alertDiv.className = 'd-none';

        const res = await apiCall('loginTimetableAdmin', { username: u, password: p });

        btn.disabled = false; btn.innerText = 'دخول';
        if (res.success) {
            currentAdminProgram = res.program;
            document.getElementById('loginScreen').classList.add('d-none');
            document.getElementById('timetableScreen').classList.remove('d-none');
            document.getElementById('welcomeUser').innerText = "مرحباً، " + u + " (" + (PROGRAMS[res.program] || res.program) + ")";
            
            // تحميل الجدول
            setupProgramsDropdown();
        } else {
            alertDiv.className = 'alert alert-danger mt-3 d-block';
            alertDiv.innerText = res.message;
        }
    }

    // إعداد قائمة البرامج وتثبيت برنامج المدير
    // إعداد قائمة البرامج وتثبيت برنامج المدير
    async function setupProgramsDropdown() {
        const sel = document.getElementById('programSelect');
        sel.innerHTML = '<option value="">جاري التحميل...</option>';
        
        // بنجيب قائمة البرامج من السيرفر
        const res = await apiCall('getProgramsList');
        sel.innerHTML = '';
        
        if (res.success && res.programs) {
            res.programs.forEach(p => {
                sel.innerHTML += `<option value="${p.id}">${p.name}</option>`;
            });
        } else {
            sel.innerHTML = '<option value="">خطأ في تحميل البرامج</option>';
        }

        // تثبيت البرنامج الخاص بالمدير
        sel.value = currentAdminProgram;
        sel.disabled = true; // قفل القائمة عشان ميعرفش يغير البرنامج
        
        loadSchedule();
    }

    
    async function loadSchedule() {
        const program = document.getElementById('programSelect').value;
        const level = document.getElementById('levelSelect').value;

        if (!program || !level) return renderTable([], '', '');

        const res = await apiCall('getBookedSlots');
        if (res.success) {
            allBookedSlots = res.booked;
            renderTable(allBookedSlots, program, level);
        } else {
            alert("خطأ في جلب البيانات: " + res.message);
        }
    }

    function renderTable(bookedData, currentProgram = '', currentLevel = '') {
        const tbody = document.getElementById('timetableBody');
        tbody.innerHTML = '';

        LECTURES.forEach(lecture => {
            let row = `<tr><td class="fw-bold bg-light">${lecture}</td>`;
            
            DAYS.forEach(day => {
                let options = `<option value="">-- اختر قاعة --</option>`;
                
                HALLS.forEach(hall => {
                    let isBookedByOther = bookedData.some(b => b.day === day && b.lecture === lecture && b.hall === hall && !(b.program === currentProgram && b.level === currentLevel));
                    let isBookedByMe = bookedData.some(b => b.day === day && b.lecture === lecture && b.hall === hall && b.program === currentProgram && b.level === currentLevel);

                    let disabled = isBookedByOther ? 'disabled' : '';
                    let selected = isBookedByMe ? 'selected' : '';
                    
                    options += `<option value="${hall}" ${disabled} ${selected}>${hall} ${isBookedByOther ? '(محجوزة)' : ''}</option>`;
                });
                
                row += `<td><select class="form-select" id="cell_${day}_${lecture}" ${bookedData.length > 0 && !currentProgram ? 'disabled' : ''}>${options}</select></td>`;
            });
            row += `</tr>`;
            tbody.innerHTML += row;
        });
    }

    async function saveSchedule() {
        const program = document.getElementById('programSelect').value;
        const level = document.getElementById('levelSelect').value;

        if (!program || !level) return alert("اختر الفرقة أولاً");

        const schedule = [];
        DAYS.forEach(day => {
            LECTURES.forEach(lecture => {
                const sel = document.getElementById(`cell_${day}_${lecture}`);
                if (sel && sel.value) {
                    schedule.push({ day: day, lecture: lecture, hall: sel.value });
                }
            });
        });

        if (schedule.length === 0) return alert("لم تقم باختيار أي قاعة.");

        const btn = document.getElementById('saveBtn');
        btn.disabled = true; btn.innerText = 'جاري الحفظ...';

        const res = await apiCall('saveProgramSchedule', {
            payload: { program: program, level: level, schedule: schedule }
        });

        btn.disabled = false; btn.innerText = '💾 حفظ الجدول';
        
        alert(res.message);
        if (res.success) loadSchedule();
    }

    function logoutAdmin() {
        location.reload();
    }
</script>
</body>
</html>
