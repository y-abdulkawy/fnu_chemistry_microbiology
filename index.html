<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة جامعة الفيوم الأهلية</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <style>
        body { 
            background: linear-gradient(135deg, #f4f6f9 0%, #e0eafc 100%); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            padding: 20px;
        }
        .portal-card { 
            background: white; 
            padding: 40px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            text-align: center; 
            max-width: 600px; 
            width: 100%; 
        }
        .header-logo { font-size: 60px; margin-bottom: 10px; }
        .btn-portal { 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%; 
            padding: 18px; 
            margin-bottom: 15px; 
            font-size: 18px; 
            font-weight: bold; 
            border-radius: 12px; 
            text-decoration: none; 
            transition: all 0.3s ease; 
            border: none;
            color: white;
        }
        .btn-portal:hover { 
            transform: translateY(-3px); 
            box-shadow: 0 5px 15px rgba(0,0,0,0.2); 
            color: white;
        }
        
        /* ألوان الزراير */
        .btn-ebook { background: linear-gradient(135deg, #0d6efd, #0a58ca); } /* أزرق */
        .btn-gpa { background: linear-gradient(135deg, #198754, #146c43); } /* أخضر */
        .btn-doctor { background: linear-gradient(135deg, #fd7e14, #e8590c); } /* برتقالي */
        .btn-admin { background: linear-gradient(135deg, #dc3545, #b02a37); } /* أحمر */
        
        hr { margin: 25px 0; }
    </style>
</head>
<body>
    <div class="portal-card">
        <div class="header-logo">🏛️</div>
        <h2 class="mb-2 text-primary fw-bold">جامعة الفيوم الأهلية</h2>
        <h5 class="text-muted mb-4">برنامج الكيمياء والميكروبيولوجي</h5>
        <hr>
        <p class="mb-4 fw-bold fs-5">اختر البوابة التي تريد الدخول إليها</p>
        
        <!-- بوابة الطلاب -->
        <a href="student_ebook.html" class="btn-portal btn-ebook">
            📚 منصة الكتاب الإلكتروني
        </a>
        
        <a href="student_gpatracker.html" class="btn-portal btn-gpa">
            📊 نظام المتابعة الأكاديمية (GPA)
        </a>

        <hr>

        <!-- بوابة الدكاترة والأدمن -->
        <a href="doctor.html" class="btn-portal btn-doctor">
            👨‍🏫 بوابة أعضاء هيئة التدريس
        </a>

        <a href="admin.html" class="btn-portal btn-admin">
            ⚙️ دخول الإدارة (الأدمن)
        </a>
    </div>
</body>
</html>
