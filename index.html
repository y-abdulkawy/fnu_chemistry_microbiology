<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة جامعة الفيوم الأهلية</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <style>
        body { 
            background: linear-gradient(135deg, #f4f6f9 0%, #e0eafc 100%); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
        }
        .portal-card { 
            background: white; 
            padding: 40px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            text-align: center; 
            max-width: 500px; 
            width: 90%; 
        }
        .header-logo { font-size: 50px; margin-bottom: 10px; }
        .btn-portal { 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%; 
            padding: 18px; 
            margin-bottom: 15px; 
            font-size: 18px; 
            font-weight: bold; 
            border-radius: 12px; 
            text-decoration: none; 
            transition: all 0.3s ease; 
            border: none;
            color: white;
        }
        .btn-portal:hover { 
            transform: translateY(-3px); 
            box-shadow: 0 5px 15px rgba(0,0,0,0.2); 
            color: white;
        }
        .btn-student { background: linear-gradient(135deg, #0d6efd, #0a58ca); }
        .btn-gpa { background: linear-gradient(135deg, #198754, #146c43); }
    </style>
</head>
<body>
    <div class="portal-card">
        <div class="header-logo">🏛️</div>
        <h2 class="mb-3 text-primary fw-bold">جامعة الفيوم الأهلية</h2>
        <h5 class="text-muted mb-4">برنامج الكيمياء والميكروبيولوجي</h5>
        <hr>
        <p class="mb-4 fw-bold">اختر البوابة التي تريد الدخول إليها</p>
        
        <!-- هنا غيرنا اسم الملف لـ student_ebook.html -->
        <a href="student_ebook.html" class="btn-portal btn-student">
            👨‍🎓 منصة الكتاب الإلكتروني  
        </a>
        
        <!-- هنا غيرنا اسم الملف لـ student_gpatracker.html -->
        <a href="student_gpatracker.html" class="btn-portal btn-gpa">
            📊 نظام المتابعة الأكاديمية (GPA)
        </a>
    </div>
</body>
</html>
